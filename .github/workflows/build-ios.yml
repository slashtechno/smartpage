# Generated by agent — 2026-06-06
# Builds an unsigned IPA on every push to main and publishes it to a rolling GitHub release.
# Both the IPA and the AltStore source JSON are uploaded as release assets — no commit-back needed.
# paths-ignore on **.md skips the expensive macos-26 runner for doc-only changes.

name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write # required to create/update releases

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's package download cache — keyed on bun.lock (text format, Bun 1.2+)
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # CocoaPods downloads are slow — cache the local pod registry and downloaded sources.
      # Keyed on package.json (not Podfile.lock) because expo prebuild --clean regenerates
      # Podfile.lock on every run, so it would never hit. Pod versions are determined by
      # npm package versions, making package.json the correct cache key.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/app/package.json') }}
          restore-keys: pods-${{ runner.os }}-

      # Install all workspace packages (app + api) at the monorepo root
      - name: Install dependencies
        run: bun install

      - name: Build unsigned IPA
        working-directory: packages/app
        env:
          BACKEND_URLS: ${{ secrets.BACKEND_URLS }}
        run: sh build-sideload.sh

      # Version: <expo.version>-<short sha>, e.g. 1.0.0-a3f2c1b
      # Every push is a new version so SideStore always detects an update.
      - name: Compute build metadata
        id: meta
        run: |
          VERSION=$(bun -e "process.stdout.write(require('./packages/app/app.json').expo.version)")
          SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}-${SHA}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "size=$(stat -f%z packages/app/dist/smartpage.ipa)" >> $GITHUB_OUTPUT

      # Generate the source JSON from app.json — runs as a committed script so it's
      # readable and testable, not buried in a YAML heredoc.
      - name: Generate AltStore source JSON from app.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
          IPA_SIZE: ${{ steps.meta.outputs.size }}
        run: bun .github/scripts/generate-altstore-source.js

      # Publish the IPA and source JSON as assets on the rolling release.
      # softprops/action-gh-release@v2 creates the release if it doesn't exist,
      # or overwrites existing assets if it does.
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling Release (${{ steps.meta.outputs.version }})
          prerelease: true
          make_latest: false
          body: "Auto-built from [`${{ github.sha }}`](https://github.com/slashtechno/smartpage/commit/${{ github.sha }}) · ${{ steps.meta.outputs.date }}"
          files: |
            packages/app/dist/smartpage.ipa
            /tmp/altstore-source.json

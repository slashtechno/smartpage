# Generated by agent — 2026-06-06
# Builds an unsigned IPA on every push to main and publishes it to a rolling GitHub release.
# Both the IPA and the AltStore source JSON are uploaded as release assets — no commit-back needed.
# paths-ignore on **.md skips the expensive macos-26 runner for doc-only changes.

name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write  # required to create/update releases

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun's package download cache — keyed on bun.lock (text format, Bun 1.2+)
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # CocoaPods downloads are slow — cache the local pod registry and downloaded sources.
      # Keyed on package.json (not Podfile.lock) because expo prebuild --clean regenerates
      # Podfile.lock on every run, so it would never hit. Pod versions are determined by
      # npm package versions, making package.json the correct cache key.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/app/package.json') }}
          restore-keys: pods-${{ runner.os }}-

      # Install all workspace packages (app + api) at the monorepo root
      - name: Install dependencies
        run: bun install

      - name: Build unsigned IPA
        working-directory: packages/app
        env:
          BACKEND_URLS: ${{ secrets.BACKEND_URLS }}
        run: sh build-sideload.sh

      # Version: <expo.version>-<short sha>, e.g. 1.0.0-a3f2c1b
      # Every push is a new version so SideStore always detects an update.
      - name: Compute build metadata
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('packages/app/app.json'))['expo']['version'])")
          SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}-${SHA}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "size=$(stat -f%z packages/app/dist/smartpage.ipa)" >> $GITHUB_OUTPUT

      # Generate the source JSON from app.json at build time — bundle ID, name, icon,
      # and permission strings are all derived so there's no separate file to maintain.
      # env: vars ensure step outputs are never interpolated directly into the script.
      - name: Generate AltStore source JSON from app.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
          IPA_SIZE: ${{ steps.meta.outputs.size }}
        run: |
          python3 - <<'EOF'
          import json, os

          with open('packages/app/app.json') as f:
              expo = json.load(f)['expo']

          # Extract permission strings from the plugins array in app.json
          camera_perm = "Allow this app to access your camera."
          calendar_perm = "Allow this app to add events to your calendar."
          for plugin in expo.get('plugins', []):
              if isinstance(plugin, list) and len(plugin) > 1:
                  name, config = plugin[0], plugin[1]
                  if name == 'expo-camera':
                      camera_perm = config.get('cameraPermission', camera_perm)
                  if name == 'expo-calendar':
                      calendar_perm = config.get('calendarPermission', calendar_perm)

          # Convert local icon path (./assets/...) to GitHub raw content URL
          icon_rel = expo.get('icon', './assets/images/icon.png').lstrip('./')
          icon_url = f"https://raw.githubusercontent.com/slashtechno/smartpage/main/packages/app/{icon_rel}"

          download_url = "https://github.com/slashtechno/smartpage/releases/download/rolling/smartpage.ipa"

          source = {
              "name": expo['name'].capitalize(),
              "apps": [{
                  "name": expo['name'],
                  "bundleIdentifier": expo['ios']['bundleIdentifier'],
                  "developerName": "slashtechno",
                  "localizedDescription": "Capture real-world event information with your camera and add them to your calendar.",
                  "iconURL": icon_url,
                  "downloadURL": download_url,
                  "versions": [{
                      "version": os.environ['VERSION'],
                      "date": os.environ['BUILD_DATE'],
                      "downloadURL": download_url,
                      "size": int(os.environ['IPA_SIZE'])
                  }],
                  "appPermissions": {
                      "entitlements": [],
                      "privacy": {
                          "NSCameraUsageDescription": camera_perm,
                          "NSCalendarsUsageDescription": calendar_perm
                      }
                  }
              }],
              "news": []
          }

          with open('/tmp/altstore-source.json', 'w') as f:
              json.dump(source, f, indent=2)
              f.write('\n')
          EOF

      # Publish the IPA and source JSON as assets on the rolling release.
      # softprops/action-gh-release@v2 creates the release if it doesn't exist,
      # or overwrites existing assets if it does.
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling Release (${{ steps.meta.outputs.version }})
          prerelease: true
          make_latest: false
          body: "Auto-built from [`${{ github.sha }}`](https://github.com/slashtechno/smartpage/commit/${{ github.sha }}) · ${{ steps.meta.outputs.date }}"
          files: |
            packages/app/dist/smartpage.ipa
            /tmp/altstore-source.json

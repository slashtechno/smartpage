# Generated by agent — 2026-06-06
# Builds an unsigned IPA on every push to main and publishes it to a rolling GitHub release.
# Both the IPA and the AltStore source JSON are uploaded as release assets — no commit-back needed.
# paths-ignore on **.md skips the expensive macos-26 runner for doc-only changes.

name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write # required to create/update releases

    steps:
      - uses: actions/checkout@v4

      # cache: true uses setup-bun's built-in caching of ~/.bun/install/cache, keyed on bun.lockb
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      # CocoaPods downloads are slow — cache the local pod registry and downloaded sources.
      # Keyed on package.json (not Podfile.lock) because expo prebuild --clean regenerates
      # Podfile.lock on every run, so it would never hit. Pod versions are determined by
      # npm package versions, making package.json the correct cache key.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/app/package.json') }}
          restore-keys: pods-${{ runner.os }}-

      # Cache extracted node_modules so bun install skips re-extraction on cache hit.
      # Keyed on bun.lock (exact dependency versions); falls back to any prior node_modules.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: node-modules-${{ runner.os }}-

      # Cache Xcode's compiled object store. --clean regenerates project files but the compiled
      # native modules (Hermes, Flipper, RCT*) are keyed on package.json + app.json — the same
      # inputs that determine which native code gets compiled. Note: actions/cache does not
      # preserve mtime, so Xcode won't do a fully incremental build, but module indexes,
      # header maps, and previously-compiled pods are still reused.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-dd-${{ runner.os }}-${{ hashFiles('packages/app/package.json', 'packages/app/app.json') }}
          restore-keys: xcode-dd-${{ runner.os }}-

      # Cache the global Swift Package Manager download store. expo prebuild --clean regenerates
      # Package.resolved on every run so we can't key on it — package.json is the proxy.
      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('packages/app/package.json') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # Must run before the build so APP_VERSION is available to app.config.ts
      - name: Compute build metadata
        id: meta
        run: |
          BASE=$(bun -e "process.stdout.write(require('./packages/app/app.json').expo.version.split('.').slice(0,2).join('.'))")
          echo "app_version=${BASE}.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Build unsigned IPA
        working-directory: packages/app
        env:
          BACKEND_URLS: ${{ secrets.BACKEND_URLS }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: sh build-sideload.sh

      - name: Generate AltStore source JSON from app.json
        env:
          VERSION: ${{ steps.meta.outputs.app_version }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
          IPA_SIZE: ${{ steps.meta.outputs.size }}
        run: |
          export IPA_SIZE=$(stat -f%z packages/app/dist/smartpage.ipa)
          bun .github/scripts/generate-altstore-source.js

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Rolling Release (${{ steps.meta.outputs.sha }})
          prerelease: true
          make_latest: false
          body: "Auto-built from [`${{ github.sha }}`](https://github.com/slashtechno/smartpage/commit/${{ github.sha }}) · ${{ steps.meta.outputs.date }}"
          files: |
            packages/app/dist/smartpage.ipa
            /tmp/altstore-source.json
